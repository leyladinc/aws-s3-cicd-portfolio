name: Deploy Static Website to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::440744256448:role/GitHubActionsS3DeployRole
          aws-region: us-east-1

      - name: Deploy website to S3
        run: aws s3 cp index.html s3://leyladinc-aws-s3-cicd-portfolio-2026/index.html --content-type "text/html"
